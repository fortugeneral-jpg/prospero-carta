    --ink:#2b2926;
    --ink-soft:#514d47;
    --paper:#efece5;
    --paper-2:#e6e2d9;
    --black:#161412;
    --bronze:#9c8355;
    --slate:#5c6b73;
    --line: rgba(43,41,38,0.18);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--black);
  }

  body{
    font-family:'Cormorant Garamond', serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .page{
    max-width:520px;
    margin:0 auto;
    background-color:var(--paper);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 35%),
      radial-gradient(circle at 85% 30%, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 40%),
      radial-gradient(circle at 30% 80%, rgba(0,0,0,0.04) 0%, rgba(0,0,0,0) 45%),
      repeating-linear-gradient(115deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
    min-height:100vh;
    position:relative;
    overflow:hidden;
  }

  .page::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:var(--casa-img);
    background-size:400px auto;
    background-position:center 44%;
    background-repeat:no-repeat;
    filter:grayscale(1) contrast(1.05);
    opacity:0.16;
    mix-blend-mode:multiply;
    pointer-events:none;
    z-index:0;
  }

  .page > *{
    position:relative;
    z-index:1;
  }

  /* ---------- HEADER ---------- */
  header{
    background:var(--black);
    color:var(--paper);
    padding:2.6rem 1.5rem 2.1rem;
    text-align:center;
    position:relative;
  }

  header::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:60px;
    height:1px;
    background:var(--bronze);
  }

  .brand-name{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:2.6rem;
    letter-spacing:0.04em;
    margin:0;
    line-height:1;
  }

  .brand-sub{
    font-family:'Jost', sans-serif;
    font-weight:500;
    font-size:0.72rem;
    letter-spacing:0.42em;
    text-transform:uppercase;
    color:var(--bronze);
    margin-top:0.85rem;
  }

  /* ---------- INTRO ---------- */
  .intro{
    text-align:center;
    padding:1.6rem 2rem 0.4rem;
    font-family:'Jost', sans-serif;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  /* ---------- NAV DOTS (category quick jump) ---------- */
  nav.jump{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:0.4rem 0.55rem;
    padding:1.1rem 1.5rem 0.4rem;
  }
  nav.jump a{
    font-family:'Jost', sans-serif;
    font-size:0.62rem;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--slate);
    text-decoration:none;
    border:1px solid var(--line);
    padding:0.35rem 0.7rem;
    border-radius:2px;
    white-space:nowrap;
  }
  nav.jump a:active{ background:var(--paper-2); }

  /* ---------- SECTIONS ---------- */
  main{ padding:1.2rem 1.6rem 1rem; }

  section.category{
    padding-top:2.4rem;
    scroll-margin-top:1rem;
  }

  .cat-head{
    display:flex;
    align-items:center;
    gap:0.75rem;
    margin-bottom:1.15rem;
  }

  .cat-head .rule{
    flex:1;
    height:1px;
    background:var(--line);
  }

  .cat-title{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:1.28rem;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--black);
    white-space:nowrap;
  }

  .cat-title.accent{ color:var(--slate); }

  .item{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:0.8rem;
    padding:0.62rem 0;
    border-bottom:1px dotted var(--line);
  }
  .item:last-child{ border-bottom:none; }

  .item-name{
    font-size:1.14rem;
    font-weight:600;
    line-height:1.25;
  }

  .item-note{
    display:block;
    font-style:italic;
    font-weight:400;
    font-size:0.95rem;
    color:var(--ink-soft);
    margin-top:0.1rem;
  }

  .item-price{
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:0.98rem;
    color:var(--bronze);
    white-space:nowrap;
    letter-spacing:0.01em;
  }

  /* ---------- ORNAMENT (facade illustration, signature element) ---------- */
  .facade-wrap{
    display:flex;
    justify-content:center;
    padding:2.6rem 1rem 1rem;
    opacity:0.85;
  }

  .facade-wrap svg{ width:200px; height:auto; }

  /* ---------- FOOTER ---------- */
  footer{
    background:var(--black);
    color:var(--paper);
    text-align:center;
    padding:2.4rem 1.5rem 2.6rem;
    margin-top:1.6rem;
  }

  footer .brand-name{ font-size:1.5rem; }
  footer .brand-sub{ margin-top:0.6rem; }

  .footer-note{
    font-family:'Jost', sans-serif;
    font-size:0.68rem;
    letter-spacing:0.08em;
    color:rgba(239,236,229,0.55);
    margin-top:1.6rem;
    line-height:1.7;
  }

  @media (min-width:521px){
    body{ padding:2rem 0; }
    .page{ border-radius:4px; box-shadow:0 30px 80px rgba(0,0,0,0.5); }
  }

  /* ---------- LOGO MARK ---------- */
  .logo-mark{
    width:96px;
    height:96px;
    border-radius:50%;
    overflow:hidden;
    margin:0 auto 1.1rem;
    border:1px solid rgba(239,236,229,0.35);
    box-shadow:0 0 0 5px rgba(239,236,229,0.06);
  }
  .logo-mark img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:grayscale(1) contrast(1.05) brightness(1.08);
  }

  footer .logo-mark{
    width:64px;
    height:64px;
    margin:0 auto 0.9rem;
  }

  /* ---------- SPLASH SCREEN ---------- */
  #splash{
    position:fixed;
    inset:0;
    z-index:1000;
    background-color:var(--black);
    background-image:var(--casa-img);
    background-size:cover;
    background-position:center 35%;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    transition:opacity 1.1s ease, visibility 1.1s ease;
  }
  #splash::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(22,20,18,0.55) 0%, rgba(22,20,18,0.35) 45%, rgba(22,20,18,0.92) 100%);
    filter:grayscale(0.3);
  }
  #splash.hide{
    opacity:0;
    visibility:hidden;
  }
  .splash-inner{
    position:relative;
    z-index:1;
    text-align:center;
    color:var(--paper);
    padding-bottom:3.4rem;
  }
  .splash-inner .brand-name{ font-size:2.4rem; }
  .splash-inner .brand-sub{ margin-top:0.7rem; }

  @media (prefers-reduced-motion: reduce){
    #splash{ transition:none; }
  }
</style>
</head>

  <div class="splash-inner">

    <div class="brand-sub">Casa Cultural</div>
  </div>

  function escapeHTML(str){
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function renderMenu(){
    const nav = document.getElementById('jumpNav');
    const main = document.getElementById('menuMain');
    if(!nav || !main) return;

    let navHTML = '';
    let mainHTML = '';

    MENU.forEach(function(cat){
      navHTML += '<a href="#' + cat.id + '">' + escapeHTML(cat.title) + '</a>';

      let itemsHTML = '';
      (cat.items || []).forEach(function(item){
        const note = item.note ? '<span class="item-note">' + escapeHTML(item.note) + '</span>' : '';
        itemsHTML +=
          '<div class="item">' +
            '<span class="item-name">' + escapeHTML(item.name) + note + '</span>' +
            '<span class="item-price">' + escapeHTML(item.price) + '</span>' +
          '</div>';
      });

      mainHTML +=
        '<section class="category" id="' + cat.id + '">' +
          '<div class="cat-head"><span class="cat-title' + (cat.accent ? ' accent' : '') + '">' +
            escapeHTML(cat.title) + '</span><span class="rule"></span></div>' +
          itemsHTML +
        '</section>';
    });

    nav.innerHTML = navHTML;
    main.innerHTML = mainHTML;
  }

  renderMenu();

  window.addEventListener('load', function(){
    var splash = document.getElementById('splash');
    setTimeout(function(){
      splash.classList.add('hide');
    }, 1300);
  });
</script>
